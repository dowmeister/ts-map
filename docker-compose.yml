services:
  # Tippecanoe service for generating vector tiles
  tippecanoe:
    build:
      context: .
      dockerfile: Dockerfile.tippecanoe
    container_name: tsmap-tippecanoe
    volumes:
      - ./map_data:/data:ro
      - ./mbtiles:/output:ro
    working_dir: /data
    command: ["tail", "-f", "/dev/null"]  # Keep container running
    profiles:
      - tools

  # Routing engine (A* on ETS2/ATS routing graph)
  routing:
    build:
      context: .
      dockerfile: Dockerfile.routing
    container_name: tsmap-routing
    ports:
      - "${ROUTING_PORT:-3001}:3001"
    volumes:
      - ./map_data:/data:ro
    environment:
      MAP_DATA_PATH: /data
      PORT: 3001
    restart: unless-stopped

  # React app server
  react-app:
    build:
      context: .
      dockerfile: Dockerfile.react
      args:
        VITE_MAP_DEFAULT_PITCH: ${VITE_MAP_DEFAULT_PITCH:-20}
        VITE_MAP_DEFAULT_ZOOM: ${VITE_MAP_DEFAULT_ZOOM:-4}
        VITE_MAP_DEFAULT_BEARING: ${VITE_MAP_DEFAULT_BEARING:-0}
        VITE_MAP_DEFAULT_CENTER_LON: ${VITE_MAP_DEFAULT_CENTER_LON:-0}
        VITE_MAP_DEFAULT_CENTER_LAT: ${VITE_MAP_DEFAULT_CENTER_LAT:-0}
        VITE_VECTOR_TILES_BASE_URL: ${VITE_VECTOR_TILES_BASE_URL:-http://localhost:8080/data}
        VITE_OVERLAY_IMAGES_BASE_URL: ${VITE_OVERLAY_IMAGES_BASE_URL:-/map_data}
    container_name: tsmap-react-app
    ports:
      - "${REACT_APP_PORT:-3000}:80"
