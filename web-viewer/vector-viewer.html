<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>ETS2 Vector Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            background-color: #1a1a1a;
        }

        #game-switcher {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }

        #game-switcher label {
            margin-right: 10px;
            font-weight: 600;
            color: #333;
        }

        #game-switcher select {
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        #game-switcher select:hover {
            border-color: #999;
        }

        #city-selector {
            position: absolute;
            top: 60px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            min-width: 200px;
        }

        #city-selector label {
            margin-right: 10px;
            font-weight: 600;
            color: #333;
        }

        #city-selector select {
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }

        #city-selector select:hover {
            border-color: #999;
        }

        #coord-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            max-width: 400px;
        }

        #coord-info .label {
            color: #00d4ff;
            font-weight: bold;
        }

        #coord-info .value {
            color: #ffffff;
        }

        #coord-info div {
            margin: 2px 0;
        }
    </style>
</head>

<body>
    <div id="game-switcher">
        <label for="game-select">Game:</label>
        <select id="game-select">
            <option value="ets2">Euro Truck Simulator 2</option>
            <option value="ats">American Truck Simulator</option>
        </select>
    </div>
    <div id="city-selector">
        <label for="city-select">Go to City:</label>
        <select id="city-select">
            <option value="">Select a city...</option>
        </select>
    </div>
    <div id="coord-info">
        <div><span class="label">Zoom:</span> <span class="value" id="zoom-value">-</span></div>
        <div><span class="label">Map Bounds:</span></div>
        <div style="margin-left: 10px;"><span class="value" id="map-bounds">-</span></div>
        <div><span class="label">Game Coords:</span></div>
        <div style="margin-left: 10px;"><span class="value" id="game-coords">-</span></div>
    </div>
    <div id="map"></div>
    <script>
        // Get game from querystring, default to 'ets2'
        const urlParams = new URLSearchParams(window.location.search);
        let currentGame = urlParams.get('game') || 'ets2';
        let tileMapInfo = null;

        // Load VectorTileMapInfo for coordinate conversion (used by vector tiles)
        async function loadTileMapInfo() {
            try {
                const response = await fetch(`../map_data/${currentGame}/VectorTileMapInfo.json`);
                tileMapInfo = await response.json();
            } catch (error) {
                console.error('Error loading VectorTileMapInfo:', error);
            }
        }

        // Convert game coordinates to map coordinates (lon/lat)
        // This MUST match the GeoJsonExporter.cs GameToLatLng() method exactly
        function gameToMapCoords(gameX, gameZ) {
            if (!tileMapInfo) return [0, 0];
            
            // Use mapper bounds from TileMapInfo.json (exported by CLI)
            const minX = tileMapInfo.x1;
            const maxX = tileMapInfo.x2;
            const minZ = tileMapInfo.y1;
            const maxZ = tileMapInfo.y2;
            
            const width = maxX - minX;
            const height = maxZ - minZ;
            
            const normalizedX = (gameX - minX) / width;
            const normalizedZ = (gameZ - minZ) / height;
            const maxExtent = 70.0; // degrees
            const aspectRatio = width / height;

            let lonRange, latRange;
            if (aspectRatio > 1.0) {
                // Map is wider than tall
                lonRange = maxExtent;
                latRange = maxExtent / aspectRatio;
            } else {
                // Map is taller than wide
                latRange = maxExtent;
                lonRange = maxExtent * aspectRatio;
            }

            const lon = (normalizedX * lonRange) - (lonRange / 2.0);
            const lat = (latRange / 2.0) - (normalizedZ * latRange);

            return [lon, lat];
        }

        // Convert map coordinates to game coordinates
        function mapToGameCoords(lon, lat) {
            if (!tileMapInfo) return [0, 0];
            
            // Same bounds as gameToMapCoords
            const minX = tileMapInfo.x1;
            const maxX = tileMapInfo.x2;
            const minZ = tileMapInfo.y1;
            const maxZ = tileMapInfo.y2;

            const width = maxX - minX;
            const height = maxZ - minZ;

            const maxExtent = 70.0;
            const aspectRatio = width / height;

            let lonRange, latRange;
            if (aspectRatio > 1.0) {
                lonRange = maxExtent;
                latRange = maxExtent / aspectRatio;
            } else {
                latRange = maxExtent;
                lonRange = maxExtent * aspectRatio;
            }

            const normalizedX = (lon + (lonRange / 2.0)) / lonRange;
            const normalizedZ = ((latRange / 2.0) - lat) / latRange;

            const gameX = minX + normalizedX * width;
            const gameZ = minZ + normalizedZ * height;

            return [gameX, gameZ];
        }

        // Update select dropdown to match current game
        document.getElementById('game-select').value = currentGame;

        // Handle game switching
        document.getElementById('game-select').addEventListener('change', (e) => {
            const newGame = e.target.value;
            const url = new URL(window.location);
            url.searchParams.set('game', newGame);
            window.location.href = url.toString();
        });

        // Load cities and populate dropdown
        async function loadCities() {
            try {
                const response = await fetch(`../map_data/${currentGame}/Cities.json`);
                if (!response.ok) {
                    console.warn('Could not load cities');
                    return;
                }
                const cities = await response.json();

                const citySelect = document.getElementById('city-select');
                citySelect.innerHTML = '<option value="">Select a city...</option>';

                // Filter out invalid cities and sort alphabetically by localized name
                const validCities = cities.filter(city => city && city.Name && city.X !== undefined && city.Y !== undefined);
                validCities.sort((a, b) => (a.Name || '').localeCompare(b.Name || ''));

                validCities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = JSON.stringify({ x: city.X, z: city.Y });
                    option.textContent = city.Name;
                    citySelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading cities:', error);
            }
        }

        // Handle city selection
        document.getElementById('city-select').addEventListener('change', (e) => {
            if (!e.target.value) return;

            const coords = JSON.parse(e.target.value);
            const [lon, lat] = gameToMapCoords(coords.x, coords.z);
            map.flyTo({ center: [lon, lat], zoom: 8 });
        });

        const map = new maplibregl.Map({
            container: 'map',
            projection: 'equirectangular',  // No distortion - flat 1:1 projection for game maps
            style: {
                version: 8,
                glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
                sources: {
                    'map': {
                        type: 'vector',
                        tiles: [`http://localhost:8080/data/${currentGame}-vector/{z}/{x}/{y}.pbf`],
                        minzoom: 4,
                        maxzoom: 8
                    },
                    'trucks': {
                        type: 'geojson',
                        data: {
                            type: 'FeatureCollection',
                            features: []
                        }
                    }
                },
                layers: [
                    {
                        id: 'background',
                        type: 'background',
                        paint: {
                            'background-color': '#1a1a1a'
                        }
                    },
                    {
                        id: 'prefab-flat',
                        type: 'fill',
                        source: 'map',
                        'source-layer': 'prefab_flat',
                        paint: {
                            'fill-color': ['get', 'color'],
                            'fill-opacity': 0.4
                        }
                    },
                    {
                        id: 'map-flat',
                        type: 'fill',
                        source: 'map',
                        'source-layer': 'map_flat',
                        paint: {
                            'fill-color': ['get', 'color'],
                            'fill-opacity': 0.4
                        }
                    },
                    {
                        id: 'roads',
                        type: 'fill',
                        source: 'map',
                        'source-layer': 'roads',
                        paint: {
                            'fill-color': '#FFC84C',
                            'fill-opacity': 1.0,
                            'fill-antialias': true,
                        },
                    },
                    {
                        id: 'prefab_roads',
                        type: 'fill',
                        source: 'map',
                        'source-layer': 'prefab_roads',
                        paint: {
                            'fill-color': '#FFC84C',
                            'fill-opacity': 1.0,
                            'fill-antialias': true,
                        }
                    },
                    {
                        id: 'ferries',
                        type: 'line',
                        source: 'map',
                        'source-layer': 'ferries',
                        paint: {
                            'line-color': '#0099ff',
                            'line-width': [
                                'interpolate',
                                ['linear'],
                                ['zoom'],
                                4, 1,     // At zoom 4, width 1px
                                6, 2,     // At zoom 6, width 2px
                                8, 3,     // At zoom 8, width 3px
                                10, 4     // At zoom 10, width 4px
                            ],
                            'line-dasharray': [2, 2]  // Dashed line for ferries
                        }
                    },
                    {
                        id: 'prefab-buildings',
                        type: 'fill-extrusion',
                        source: 'map',
                        'source-layer': 'prefab_buildings',
                        paint: {
                            'fill-extrusion-color': ['get', 'color'],
                            'fill-extrusion-height': 600,
                            'fill-extrusion-base': 0,
                            'fill-extrusion-opacity': 1,
                        }
                    },
                    {
                        id: 'map-buildings',
                        type: 'fill-extrusion',
                        source: 'map',
                        'source-layer': 'map_buildings',
                        paint: {
                            'fill-extrusion-color': ['get', 'color'],
                            'fill-extrusion-height': 600,
                            'fill-extrusion-base': 0,
                            'fill-extrusion-opacity': 1,
                        }
                    },
                    {
                        id: 'companies',
                        type: 'circle',
                        source: 'map',
                        'source-layer': 'companies',
                        paint: {
                            'circle-radius': 3,
                            'circle-color': '#ff6600',
                            'circle-stroke-width': 1,
                            'circle-stroke-color': '#ffffff'
                        }
                    },
                    {
                        id: 'overlays',
                        type: 'symbol',
                        source: 'map',
                        'source-layer': 'overlays',
                        layout: {
                            'icon-image': ['get', 'image'],
                            'icon-size': [
                                'interpolate',
                                ['linear'],
                                ['zoom'],
                                4, 0.3,   // At zoom 4, size 0.3
                                6, 0.5,   // At zoom 6, size 0.5
                                8, 0.8,   // At zoom 8, size 0.8
                                10, 1.2   // At zoom 10, size 1.2
                            ],
                            'icon-allow-overlap': true,
                            'icon-ignore-placement': true
                        }
                    },
                    {
                        id: 'city-pins',
                        type: 'circle',
                        source: 'map',
                        'source-layer': 'cities',
                        paint: {
                            'circle-radius': [
                                'interpolate',
                                ['linear'],
                                ['zoom'],
                                4, 4,     // At zoom 4, radius 4px
                                6, 6,     // At zoom 6, radius 6px
                                8, 8,     // At zoom 8, radius 8px
                                10, 10    // At zoom 10, radius 10px
                            ],
                            'circle-color': '#ff3333',
                            'circle-stroke-width': 2,
                            'circle-stroke-color': '#ffffff'
                        }
                    },
                    {
                        id: 'city-labels',
                        type: 'symbol',
                        source: 'map',
                        'source-layer': 'cities',
                        layout: {
                            'text-field':
                                ['get', 'localized_name'],

                            'text-size': [
                                'interpolate',
                                ['linear'],
                                ['zoom'],
                                4, 11,    // At zoom 4, size 11px
                                6, 13,    // At zoom 6, size 13px
                                8, 16,    // At zoom 8, size 16px
                                10, 20    // At zoom 10, size 20px
                            ],
                            'text-anchor': 'top',
                            'text-offset': [0, 0.8],
                            'text-allow-overlap': true,
                            'text-ignore-placement': false
                        },
                        paint: {
                            'text-color': '#ffffff',
                            'text-halo-color': '#000000',
                            'text-halo-width': 2.5
                        }
                    },
                    {
                        id: 'trucks',
                        type: 'circle',
                        source: 'trucks',
                        paint: {
                            'circle-radius': 5,
                            'circle-color': '#00ff00',
                            'circle-stroke-width': 2,
                            'circle-stroke-color': '#ffffff'
                        },
                        minzoom: 7
                    }
                ]
            },
            center: [0, 0],  // Map is centered at origin with new coordinate system
            zoom: 4,
            minZoom: 4,
            pitch: 20,  // Isometric view to show 3D building elevation
            bearing: 0,
            renderWorldCopies: false  // Don't repeat the map - this is a fixed game map, not the earth
        });

        map.addControl(new maplibregl.NavigationControl());

        // Enable terrain/3D controls
        map.dragRotate.enable();
        map.touchZoomRotate.enableRotation();

        // Add error handler
        map.on('error', (e) => {
            console.error('Map error:', e);
        });

        function initializeTrucks() {
            updateCoordinateInfo();

            // Start polling for trucks if on ETS2 and zoom > 7
            if (currentGame === 'ets2') {
                checkAndStartTruckTracking();
            }
        }

        map.once('load', async () => {
            await loadTileMapInfo();
            initializeTrucks();
            await loadCities();
        });

        // TruckersMP tracking
        let truckUpdateInterval = null;
        const TRUCK_UPDATE_INTERVAL = 3000; // 3 seconds
        const MIN_ZOOM_FOR_TRUCKS = 7;

        function checkAndStartTruckTracking() {
            const currentZoom = map.getZoom();
            if (currentZoom > MIN_ZOOM_FOR_TRUCKS && !truckUpdateInterval) {
                startTruckTracking();
            } else if (currentZoom <= MIN_ZOOM_FOR_TRUCKS && truckUpdateInterval) {
                stopTruckTracking();
            }
        }

        // Listen to zoom changes
        map.on('zoom', () => {
            if (currentGame === 'ets2') {
                checkAndStartTruckTracking();
            }
        });

        function startTruckTracking() {
            // Initial load
            updateTrucks();

            // Poll every 3 seconds
            truckUpdateInterval = setInterval(updateTrucks, TRUCK_UPDATE_INTERVAL);
        }

        function stopTruckTracking() {
            if (truckUpdateInterval) {
                clearInterval(truckUpdateInterval);
                truckUpdateInterval = null;
                // Clear trucks from map
                const source = map.getSource('trucks');
                if (source) {
                    source.setData({
                        type: 'FeatureCollection',
                        features: []
                    });
                }
            }
        }

        async function updateTrucks() {
            try {
                const bounds = map.getBounds();

                // Convert map bounds to game coordinates
                const [x1, y1] = mapToGameCoords(bounds.getWest(), bounds.getSouth());
                const [x2, y2] = mapToGameCoords(bounds.getEast(), bounds.getNorth());

                // TruckersMP API - server 2 is Simulation 1
                const url = `https://tracker.ets2map.com/v3/area?x1=${Math.floor(x1)}&y1=${Math.floor(y1)}&x2=${Math.ceil(x2)}&y2=${Math.ceil(y2)}&server=2`;

                const response = await fetch(url);
                if (!response.ok) return;

                const data = await response.json();

                // Convert truck data to GeoJSON
                const features = data.Data.map(truck => {
                    // Convert game coordinates to map coordinates
                    // TruckersMP API: truck.X = game X, truck.Y = game Z (north-south)
                    const [lon, lat] = gameToMapCoords(truck.X, truck.Y);

                    return {
                        type: 'Feature',
                        geometry: {
                            type: 'Point',
                            coordinates: [lon, lat]
                        },
                        properties: {
                            name: truck.Name,
                            mpId: truck.MpId,
                            playerId: truck.PlayerId,
                            vtcId: truck.VtcId
                        }
                    };
                });

                // Update the trucks source
                const source = map.getSource('trucks');
                if (source) {
                    source.setData({
                        type: 'FeatureCollection',
                        features: features
                    });
                }
            } catch (error) {
                console.error('Error updating trucks:', error);
            }
        }

        // Update coordinate info panel
        function updateCoordinateInfo() {
            const zoom = map.getZoom().toFixed(2);
            const bounds = map.getBounds();

            // Map coordinates (lat/lng)
            const mapBounds = `SW: [${bounds.getWest().toFixed(4)}, ${bounds.getSouth().toFixed(4)}] NE: [${bounds.getEast().toFixed(4)}, ${bounds.getNorth().toFixed(4)}]`;

            // Game coordinates conversion using proper formula
            const [gameSW_X, gameSW_Z] = mapToGameCoords(bounds.getWest(), bounds.getSouth());
            const [gameNE_X, gameNE_Z] = mapToGameCoords(bounds.getEast(), bounds.getNorth());

            const gameCoords = `SW: [X:${gameSW_X.toFixed(0)}, Z:${gameSW_Z.toFixed(0)}] NE: [X:${gameNE_X.toFixed(0)}, Z:${gameNE_Z.toFixed(0)}]`;

            document.getElementById('zoom-value').textContent = zoom;
            document.getElementById('map-bounds').textContent = mapBounds;
            document.getElementById('game-coords').textContent = gameCoords;
        }

        // Update coordinate info on move and zoom
        map.on('move', updateCoordinateInfo);
        map.on('zoom', updateCoordinateInfo);

        // Dynamically load overlay images when MapLibre requests them
        map.on('styleimagemissing', (e) => {
            const imageId = e.id;

            // Load the image from the exported overlay_images directory
            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = () => {
                if (!map.hasImage(imageId)) {
                    map.addImage(imageId, img);
                }
            };

            img.onerror = () => {
                // Create a fallback placeholder image
                const size = 32;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                if (!map.hasImage(imageId)) {
                    map.addImage(imageId, canvas);
                }
            };

            // Try to load from the overlay_images directory
            img.src = `../map_data/${currentGame}/overlay_images/${imageId}`;
        });

        map.dragPan.enable();
        map.dragRotate.enable();
        map.touchZoomRotate.enable();
        map.touchPitch.enable();
    </script>
</body>

</html>
